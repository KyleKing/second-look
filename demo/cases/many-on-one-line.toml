# Five comments anchored to one line, plus one on its own for contrast. What the
# comment block was never designed for: edit, add, and remove comments here and
# run `demo/case.sh many-on-one-line` again to see the layout change.
version = 1
host = "github.com"
owner = "KyleKing"
repo = "second-look"
number = 2
head_sha = "6bc1218809a6faf83bc266c7a10b6b096f814a74"
event = "COMMENT"
body = ""
note = "A layout case, not a real review."

[[comment]]
id = "one"
path = "testdata/fixture/sample.go"
line = 19
side = "RIGHT"
anchor = "\t\treturn 0, err"
body = "This returns os.ReadFile's error with no context, so the caller sees a bare `no such file or directory` and cannot tell which budget failed. Wrap it: `fmt.Errorf(\"reading %s: %w\", path, err)`."
note = "Matches the wrapping rule in AGENTS.md.\nRan: go vet ./... -> clean, so nothing else catches this."
severity = "blocker"
status = "draft"

