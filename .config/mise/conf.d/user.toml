# Project tasks. Loaded after template.toml (mise reads conf.d/*.toml in
# alphabetical order and the last definition wins), so a task named here
# overrides the template's.

# Overrides the template's task, which counts only what the test binaries run.
# Everything cmd/second-look tests happens in a child process, so `go test
# -cover` sees none of it and internal/get reads as 0%. The child is built with
# `go build -cover` and writes into COVERDIR_SUBPROCESS; both halves are
# covdata directories, which is the only format `go tool covdata merge` takes.
[tasks."test:coverage-min"]
description = "Verify minimum coverage threshold (70%), subprocess tests included"
run = '''
set -euo pipefail
dir=$(mktemp -d)
mkdir -p "$dir/unit" "$dir/subprocess" "$dir/merged"
COVERDIR_SUBPROCESS="$dir/subprocess" go test -count=1 -cover -coverpkg=./... ./... -args -test.gocoverdir="$dir/unit"
go tool covdata merge -i="$dir/unit,$dir/subprocess" -o="$dir/merged"
go tool covdata textfmt -i="$dir/merged" -o=coverage.out
# Anchored: the profile's last line is "total:", and a plain grep also matches
# every covered function whose name contains it.
coverage=$(go tool cover -func=coverage.out | grep '^total:' | awk '{print $3}' | sed 's/%//')
echo "Current coverage: ${coverage}%"
if (( $(awk "BEGIN {print ($coverage < 70)}") )); then
    echo "Coverage ${coverage}% is below 70% minimum threshold"
    exit 1
fi
rm -rf "$dir"
'''

# The workflow runs this if it exists, so the floor is enforced without editing
# .github/workflows/, which copier overwrites.
[tasks."ci:project"]
description = "Project-specific CI gates"
depends = ["test:coverage-min"]
run = "echo 'project checks passed'"

# The structural pass shells out to this rather than linking tree-sitter, whose
# every Go binding needs cgo, which the ten-platform release matrix builds with
# CGO_ENABLED=0. Pinned here rather than in template.toml because it is this
# project's dependency, and installed in CI so internal/structure's tests run
# there instead of skipping.
[tools]
"aqua:ast-grep/ast-grep" = "0.45.3"
