path = "testdata/fixture/sample.go"
line = 28
side = "RIGHT"
start_line = 25
start_side = "RIGHT"
body = "A line that does not parse is skipped silently, so a typo in the budget file reads as a smaller total rather than as an error. Return the failure instead of continuing past it."
anchor = "\t\t}"
note = "The failure mode is a wrong number, not a crash, which is why it is worth catching here."
severity = "major"
status = "ready"

